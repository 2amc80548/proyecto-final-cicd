name: Java CI with Maven

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean package --file pom.xml -DskipTests

    - name: Run unit tests with Maven
      run: mvn -B test --file pomxml

    - name: Run Code Coverage (JaCoCo) with Maven
      run: mvn -B jacoco:report --file pom.xml

    # Publicar JAR como artefacto
    - name: Publish JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapi-artifact
        path: target/*.jar

    # Publicar Reporte de Pruebas JUnit
    - name: Publish Test Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-report-artifact
        path: target/surefire-reports/

    # Publicar Reporte de Cobertura JaCoCo
    - name: Publish Code Coverage Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report-artifact
        path: target/site/jacoco/
